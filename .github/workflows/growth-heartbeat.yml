name: Growth heartbeat

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      include_metrics:
        description: Include live GitHub repository and traffic metrics
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: growth-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    outputs:
      campaign_state: ${{ steps.campaign.outputs.state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read campaign state
        id: campaign
        run: echo "state=$(python3 -c 'import json; print(json.load(open(\"growth/config.json\"))[\"campaign_state\"])')" >> "$GITHUB_OUTPUT"
      - name: Validate campaign
        run: python3 scripts/growth.py validate
      - name: Generate heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          metrics_flag="--with-metrics"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_metrics }}" != "true" ]; then
            metrics_flag=""
          fi
          python3 scripts/growth.py heartbeat $metrics_flag > growth-heartbeat.md
          cat growth-heartbeat.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growth-heartbeat
          path: growth-heartbeat.md
          retention-days: 7
          overwrite: true

  issue:
    needs: heartbeat
    if: github.event_name == 'workflow_dispatch' && needs.heartbeat.outputs.campaign_state == 'active'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: growth-heartbeat
      - name: Update the operational heartbeat issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "[Growth] Daily heartbeat"
        run: |
          gh label create growth-ops --color 1d76db --description "Repository growth operations" --force
          issue_number="$(gh issue list --state open --label growth-ops --json number,title --jq '.[] | select(.title == "[Growth] Daily heartbeat") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file growth-heartbeat.md
          else
            gh issue create --title "$TITLE" --label growth-ops --body-file growth-heartbeat.md
          fi
