name: Growth content drafts

on:
  schedule:
    - cron: '30 12 * * 3'
  workflow_dispatch:
    inputs:
      content_id:
        description: Optional content queue ID; blank renders the next seven days
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: growth-content-drafts
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      campaign_state: ${{ steps.campaign.outputs.state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read campaign state
        id: campaign
        run: echo "state=$(python3 -c 'import json; print(json.load(open(\"growth/config.json\"))[\"campaign_state\"])')" >> "$GITHUB_OUTPUT"
      - name: Render approval-gated drafts
        env:
          CONTENT_ID: ${{ inputs.content_id }}
        run: |
          if [ -n "$CONTENT_ID" ]; then
            python3 scripts/growth.py content --id "$CONTENT_ID" > growth-content.md
          else
            python3 scripts/growth.py content --window 7 > growth-content.md
          fi
          cat growth-content.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growth-content
          path: growth-content.md
          retention-days: 7
          overwrite: true
      - name: Confirm publication boundary
        run: |
          echo 'Draft generation is complete. This workflow has no community, social, email, or release-publishing step.'

  issue:
    needs: draft
    if: github.event_name == 'workflow_dispatch' && needs.draft.outputs.campaign_state == 'active'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: growth-content
      - name: Open the repository review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="[Growth content] $(date -u +%G-W%V) approval queue"
          gh label create content-draft --color fbca04 --description "Draft requiring human approval before publication" --force
          issue_number="$(gh issue list --state open --label content-draft --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file growth-content.md
          else
            gh issue create --title "$title" --label content-draft --body-file growth-content.md
          fi
