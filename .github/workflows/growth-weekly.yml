name: Weekly growth brief

on:
  schedule:
    - cron: '15 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-growth-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    outputs:
      campaign_state: ${{ steps.campaign.outputs.state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read campaign state
        id: campaign
        run: echo "state=$(python3 -c 'import json; print(json.load(open(\"growth/config.json\"))[\"campaign_state\"])')" >> "$GITHUB_OUTPUT"
      - name: Generate weekly brief
        run: |
          python3 scripts/growth.py weekly > weekly-growth.md
          cat weekly-growth.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-growth
          path: weekly-growth.md
          retention-days: 7
          overwrite: true

  issue:
    needs: brief
    if: github.event_name == 'workflow_dispatch' && needs.brief.outputs.campaign_state == 'active'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: weekly-growth
      - name: Open this week's operating issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="[Growth] Weekly brief $(date -u +%G-W%V)"
          gh label create growth-ops --color 1d76db --description "Repository growth operations" --force
          issue_number="$(gh issue list --state open --label growth-ops --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file weekly-growth.md
          else
            gh issue create --title "$title" --label growth-ops --body-file weekly-growth.md
          fi
